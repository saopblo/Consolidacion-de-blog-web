{% extends "posts/base.html" %}

{% block title %}Eliminar post | Mi Blog{% endblock %}

{% block content %}
<h1 class="section-heading">Eliminar publicación</h1>

<p>¿Seguro que querés eliminar el post <strong>{{ post.titulo }}</strong>?</p>

<form method="post">
{% csrf_token %}
<button type="submit">Sí, eliminar</button>
</form>

<a class="btn btn-outline-secondary mt-3" href="{% url 'detalle_post' post.slug %}">Cancelar</a>
{% endblock %}
